name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Reject private source material and credentials
        shell: bash
        run: |
          test -z "$(git ls-files 'docs/base/**')"
          ! git grep -nE 'eyJ[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY' -- ':!package-lock.json'
      - run: docker compose config
